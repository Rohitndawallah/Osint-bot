<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 pb-16">
    <nav class="h-16 bg-white border-b flex items-center px-4 sticky top-0 z-20">
        <button onclick="history.back()" class="text-gray-600 font-bold text-sm">← Back</button>
        <h1 class="ml-4 font-bold text-gray-800">Content</h1>
    </nav>
    <div id="tabsContainer" class="flex gap-2 p-4 overflow-x-auto bg-white">
        <button onclick="loadContent('videos', this)" class="tab-btn px-4 py-2 rounded-full bg-indigo-600 text-white text-sm font-bold">Lectures</button>
        <button onclick="loadContent('notes', this)" class="tab-btn px-4 py-2 rounded-full bg-white border text-sm font-bold">Notes</button>
        <button onclick="loadContent('dpp', this)" class="tab-btn px-4 py-2 rounded-full bg-white border text-sm font-bold">DPP</button>
    </div>
    <div id="contentContainer" class="p-4"></div>
    <div id="playerModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center">
        <div class="bg-white p-6 rounded-xl w-80 shadow-xl">
            <h2 class="text-lg font-bold mb-4">Select Player</h2>
            <button id="p1Btn" class="w-full bg-blue-600 text-white py-2 rounded-lg mb-2 font-bold">Player 1</button>
            <button id="p2Btn" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-bold">Player 2</button>
            <button onclick="document.getElementById('playerModal').classList.add('hidden')" class="w-full mt-4 text-gray-500 text-sm">Cancel</button>
        </div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const bId = params.get("batchId");
        const sId = params.get("subjectId");
        const tId = params.get("topicId");
        async function loadContent(tab, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('bg-indigo-600', 'text-white');
                b.classList.add('bg-white', 'border');
            });
            if(btn) {
                btn.classList.add('bg-indigo-600', 'text-white');
                btn.classList.remove('bg-white', 'border');
            }
            const container = document.getElementById('contentContainer');
            container.innerHTML = '<div class="text-center mt-10">Loading...</div>';
            try {
                const finalUrl = `https://devcoderz-player.vercel.app/api/lectures?batchId=${bId}&subjectId=${sId}&contentType=${tab}&tag=${tId}&page=1`;
                const res = await fetch(finalUrl);
                const json = await res.json();
                const items = json.data || [];
                if (items.length > 0) {
                    container.innerHTML = items.map(item => {
                        const isVideo = tab === 'videos';
                        let title = item.topic || (item.homeworkIds && item.homeworkIds[0]?.topic) || 'Untitled';
                        let downloadUrl = '#';
                        if (!isVideo && item.homeworkIds && item.homeworkIds[0]?.attachmentIds?.length > 0) {
                            const att = item.homeworkIds[0].attachmentIds[0];
                            downloadUrl = att.baseUrl + att.key;
                        }
                        return `
                        <div class="bg-white p-4 mb-3 rounded-xl border flex items-center justify-between">
                            <div class="flex-1"><h3 class="font-bold text-sm text-gray-800">${title}</h3></div>
                            <button class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-bold" 
                                    onclick="${isVideo ? `openPlayerModal('${item._id}')` : `window.open('${downloadUrl}', '_blank')`}">
                                ${isVideo ? 'Watch' : 'Download'}
                            </button>
                        </div>`;
                    }).join('');
                } else {
                    container.innerHTML = '<div class="text-center mt-10 text-gray-500">No content found</div>';
                }
            } catch (e) { container.innerHTML = `<div class="text-center mt-10 text-red-500">Error</div>`; }
        }
        function openPlayerModal(id) {
            document.getElementById('playerModal').classList.remove('hidden');
            document.getElementById('p1Btn').onclick = () => window.location.href = `player.html?batchId=${bId}&lectureId=${id}`;
            document.getElementById('p2Btn').onclick = async () => {
                const res = await fetch(`https://api.pimaxer.in/v1/videos/video-url-details?parentId=${bId}&childId=${id}`);
                const data = await res.json();
                if(data?.data?.url) {
                    window.location.href = `https://devcoderz-player.vercel.app/?Url=${encodeURIComponent(data.data.url)}`;
                } else {
                    alert("Link not found");
                }
            };
        }
        loadContent('videos', document.querySelector('.tab-btn'));
    </script>
</body>
</html>
