<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Page</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; }
        #player-frame { width: 100%; height: 100vh; border: none; }
    </style>
</head>
<body>

    <iframe id="player-frame" allow="autoplay; encrypted-media" allowfullscreen></iframe>

    <script>
        const params = new URLSearchParams(window.location.search);
        
        const videoId = params.get('videoId');
        const schId = params.get('schId');
        const batchId = params.get('batchId');
        const subjectId = params.get('subjectId');
        const lectureId = params.get('lectureId');
        const title = params.get('title');

        const baseUrl = "https://studyparcham.in/pw/player";
        
        const targetUrl = `${baseUrl}?videoId=${videoId}&schId=${schId}&batchId=${batchId}&subjectId=${subjectId}&lectureId=${lectureId}&title=${encodeURIComponent(title)}`;

        document.getElementById('player-frame').src = targetUrl;
    </script>
</body>
</html>
