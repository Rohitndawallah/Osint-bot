<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Player</title>
    <style>
        /* Body aur html ko fix karna */
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #000; 
        }

        /* Iframe ko force-fit karna */
        #player-frame { 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe id="player-frame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>

    <script>
        const params = new URLSearchParams(window.location.search);
        
        // Dynamic URL constructor
        const baseUrl = "https://thedevcoderz-pw.pages.dev/player2";
        const queryParams = window.location.search; // Ye pure query string ko utha lega
        
        document.getElementById('player-frame').src = baseUrl + queryParams;
    </script>
</body>
</html>
