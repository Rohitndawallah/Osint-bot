<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
        .loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-family: sans-serif; }
    </style>
</head>
<body>

    <div id="loader" class="loader">Loading Video Stream...</div>
    <iframe id="videoPlayer" src="" allowfullscreen></iframe>

    <script>
        const params = new URLSearchParams(window.location.search);
        const batchId = params.get("batchId");
        const lectureId = params.get("lectureId");
        const subjectId = params.get("subjectId");

        const apiUrl = `https://devcoderz-player.vercel.app/api/stream.js?batchId=${batchId}&lectureId=${lectureId}&subjectId=${subjectId}`;

        fetch(apiUrl)
            .then(res => res.json())
            .then(data => {
                if (data && data.url) {
                    const match = data.url.match(/mediacdn\.pw\.live\/([a-f0-9-]+)\//);
                    if (match && match[1]) {
                        const videoId = match[1];
                        const pimaxerUrl = `https://stream.pimaxer.in/${videoId}/master.m3u8`;
                        const playerSrc = `https://devcoderz-player.vercel.app/rs45.html?Url=${encodeURIComponent(pimaxerUrl)}`;
                        
                        document.getElementById("videoPlayer").src = playerSrc;
                        document.getElementById("loader").style.display = "none";
                    } else {
                        document.body.innerHTML = "<div class='loader'>Error: Could not extract Video ID</div>";
                    }
                } else {
                    document.body.innerHTML = "<div class='loader'>Error: Video link not found</div>";
                }
            })
            .catch(err => {
                console.error(err);
                document.body.innerHTML = "<div class='loader'>Error loading stream</div>";
            });
    </script>
</body>
</html>
