<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Player...</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; background: #f5f6f8; }
        .loader { font-size: 18px; color: #4f46e5; font-weight: bold; }
    </style>
</head>
<body>

    <div class="loader">Loading Video Stream...</div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const batchId = params.get("batchId");
        const lectureId = params.get("lectureId");
        const subjectId = params.get("subjectId");

        const apiUrl = `https://devcoderz-player.vercel.app/api/stream.js?batchId=${batchId}&lectureId=${lectureId}&subjectId=${subjectId}`;

        fetch(apiUrl)
            .then(res => res.json())
            .then(data => {
                if (data && data.url) {
                    const originalUrl = data.url;
                    const match = originalUrl.match(/mediacdn\.pw\.live\/([a-f0-9-]+)\//);
                    
                    if (match && match[1]) {
                        const videoId = match[1];
                        const pimaxerUrl = `https://stream.pimaxer.in/${videoId}/master.m3u8`;
                        window.location.href = `https://devcoderz-player.vercel.app/?Url=${encodeURIComponent(pimaxerUrl)}`;
                    } else {
                        document.body.innerHTML = "<div class='loader'>Error: Could not extract Video ID</div>";
                    }
                } else {
                    document.body.innerHTML = "<div class='loader'>Error: Video link not found</div>";
                }
            })
            .catch(err => {
                console.error(err);
                document.body.innerHTML = "<div class='loader'>Error loading stream</div>";
            });
    </script>
</body>
</html>
