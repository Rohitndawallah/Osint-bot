<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lecture Player — DevCoderz</title>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #6C5CE7;
            --primary-light: #a29bfe;
            --bg-dark: #0a0a0f;
            --bg-card: #12121a;
            --bg-controls: rgba(10, 10, 15, 0.92);
            --text: #ffffff;
            --text-muted: #8b8b9e;
            --accent: #00cec9;
            --danger: #ff4757;
            --success: #2ed573;
            --gradient: linear-gradient(135deg, #6C5CE7, #00cec9);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Loading Screen */
        #loadingScreen {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        #loadingScreen.hidden { opacity: 0; pointer-events: none; }

        .loader-ring {
            width: 70px; height: 70px;
            border: 4px solid rgba(108, 92, 231, 0.15);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 24px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .loader-text {
            font-size: 15px;
            color: var(--text-muted);
            letter-spacing: 1px;
        }
        .loader-text span { color: var(--primary-light); font-weight: 600; }

        /* Error Screen */
        #errorScreen {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9998;
            padding: 20px;
            text-align: center;
        }
        #errorScreen i { font-size: 52px; color: var(--danger); margin-bottom: 20px; }
        #errorScreen h2 { font-size: 22px; margin-bottom: 10px; }
        #errorScreen p { color: var(--text-muted); font-size: 14px; max-width: 400px; margin-bottom: 24px; }
        #retryBtn {
            background: var(--gradient);
            border: none;
            color: #fff;
            padding: 12px 32px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #retryBtn:hover { transform: scale(1.05); }

        /* Player Container */
        .player-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        .top-bar {
            background: var(--bg-card);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 100;
        }
        .top-bar .logo {
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            font-size: 20px;
            letter-spacing: -0.5px;
        }
        .top-bar .divider {
            width: 1px;
            height: 24px;
            background: rgba(255,255,255,0.1);
        }
        .top-bar .lecture-title {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }
        .top-bar .live-badge {
            background: var(--danger);
            color: #fff;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            animation: pulse-badge 2s infinite;
        }
        @keyframes pulse-badge {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* Video Wrapper */
        .video-wrapper {
            position: relative;
            width: 100%;
            flex: 1;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: default;
        }
        .video-wrapper.fullscreen-mode {
            position: fixed;
            inset: 0;
            z-index: 10000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #000;
        }

        /* Overlay for center actions */
        .center-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 20;
        }

        .play-big-btn {
            width: 72px; height: 72px;
            background: rgba(108, 92, 231, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.7);
            transition: all 0.25s ease;
            pointer-events: auto;
            cursor: pointer;
            border: none;
        }
        .play-big-btn.visible { opacity: 1; transform: scale(1); }
        .play-big-btn i { font-size: 28px; color: #fff; margin-left: 4px; }

        /* Skip Indicators */
        .skip-indicator {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
            padding: 16px 22px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 25;
        }
        .skip-indicator.left { left: 15%; }
        .skip-indicator.right { right: 15%; }
        .skip-indicator.show { opacity: 1; }
        .skip-indicator i { font-size: 22px; color: #fff; }
        .skip-indicator span { font-size: 11px; color: #fff; font-weight: 600; }

        /* Brightness / Volume OSD */
        .osd-bar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-controls);
            backdrop-filter: blur(16px);
            padding: 10px 24px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 30;
            pointer-events: none;
        }
        .osd-bar.show { opacity: 1; }
        .osd-bar i { font-size: 16px; color: var(--primary-light); }
        .osd-bar .osd-track {
            width: 140px; height: 4px;
            background: rgba(255,255,255,0.15);
            border-radius: 4px;
            overflow: hidden;
        }
        .osd-bar .osd-fill {
            height: 100%;
            background: var(--gradient);
            border-radius: 4px;
            transition: width 0.15s;
        }
        .osd-bar .osd-val { font-size: 13px; color: #fff; font-weight: 600; min-width: 36px; text-align: right; }

        /* Controls Bar */
        .controls-wrapper {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 50;
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
            padding: 40px 0 0 0;
            opacity: 1;
            transition: opacity 0.35s ease;
        }
        .controls-wrapper.hidden { opacity: 0; pointer-events: none; }

        /* Progress Bar */
        .progress-container {
            padding: 0 16px;
            margin-bottom: 6px;
            cursor: pointer;
            position: relative;
        }
        .progress-bar-bg {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.15);
            border-radius: 4px;
            position: relative;
            transition: height 0.15s;
        }
        .progress-container:hover .progress-bar-bg { height: 7px; }
        
        .progress-buffered {
            position: absolute;
            top: 0; left: 0;
            height: 100%;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            pointer-events: none;
        }
        .progress-fill {
            position: absolute;
            top: 0; left: 0;
            height: 100%;
            background: var(--gradient);
            border-radius: 4px;
            pointer-events: none;
        }
        .progress-thumb {
            position: absolute;
            top: 50%;
            width: 14px; height: 14px;
            background: #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px rgba(108, 92, 231, 0.5);
            opacity: 0;
            transition: opacity 0.15s;
        }
        .progress-container:hover .progress-thumb { opacity: 1; }

        .progress-tooltip {
            position: absolute;
            bottom: 22px;
            transform: translateX(-50%);
            background: var(--bg-controls);
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            white-space: nowrap;
        }
        .progress-container:hover .progress-tooltip { opacity: 1; }

        /* Controls Row */
        .controls-row {
            display: flex;
            align-items: center;
            padding: 6px 12px 10px;
            gap: 4px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: #fff;
            width: 40px; height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            font-size: 17px;
            position: relative;
            flex-shrink: 0;
        }
        .ctrl-btn:hover { background: rgba(255,255,255,0.1); }
        .ctrl-btn:active { transform: scale(0.9); }

        .time-display {
            font-size: 12px;
            color: rgba(255,255,255,0.75);
            font-weight: 500;
            padding: 0 6px;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .spacer { flex: 1; }

        /* Volume Slider */
        .volume-group {
            display: flex;
            align-items: center;
            gap: 0;
        }
        .volume-slider-wrap {
            width: 0;
            overflow: hidden;
            transition: width 0.3s ease;
        }
        .volume-group:hover .volume-slider-wrap,
        .volume-slider-wrap.active {
            width: 80px;
        }
        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 70px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            outline: none;
            margin: 0 6px;
            cursor: pointer;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px; height: 14px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(0,0,0,0.3);
        }

        /* Speed Menu */
        .speed-menu {
            position: absolute;
            bottom: 52px;
            right: 0;
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 8px 0;
            min-width: 140px;
            display: none;
            z-index: 100;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }
        .speed-menu.show { display: block; }
        .speed-menu-item {
            padding: 10px 18px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.15s;
            color: var(--text-muted);
        }
        .speed-menu-item:hover { background: rgba(255,255,255,0.05); }
        .speed-menu-item.active {
            color: var(--primary-light);
            font-weight: 600;
        }
        .speed-menu-item.active::after {
            content: '✓';
            color: var(--primary-light);
            font-size: 14px;
        }

        /* Quality Menu */
        .quality-menu {
            position: absolute;
            bottom: 52px;
            right: 0;
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 8px 0;
            min-width: 160px;
            display: none;
            z-index: 100;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }
        .quality-menu.show { display: block; }
        .quality-menu-item {
            padding: 10px 18px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.15s;
            color: var(--text-muted);
        }
        .quality-menu-item:hover { background: rgba(255,255,255,0.05); }
        .quality-menu-item.active {
            color: var(--accent);
            font-weight: 600;
        }
        .quality-menu-item.active::after {
            content: '✓';
            color: var(--accent);
            font-size: 14px;
        }

        /* Speed Badge */
        .speed-badge {
            font-size: 11px;
            font-weight: 700;
            background: rgba(108, 92, 231, 0.2);
            color: var(--primary-light);
            padding: 2px 7px;
            border-radius: 5px;
            min-width: 28px;
            text-align: center;
        }

        /* Bottom Info */
        .bottom-info {
            background: var(--bg-card);
            border-top: 1px solid rgba(255,255,255,0.06);
            padding: 16px 20px;
        }
        .info-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .info-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.04);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            color: var(--text-muted);
        }
        .info-chip i { font-size: 13px; color: var(--primary-light); }

        /* Keyboard Shortcuts Panel */
        .shortcuts-panel {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 99999;
        }
        .shortcuts-panel.show { display: flex; }
        .shortcuts-card {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 28px 32px;
            width: 90%;
            max-width: 420px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .shortcuts-card h3 {
            font-size: 18px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .shortcuts-card h3 button {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
        }
        .shortcut-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .shortcut-row:last-child { border: none; }
        .shortcut-row span { color: var(--text-muted); font-size: 13px; }
        .shortcut-key {
            background: rgba(255,255,255,0.08);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            font-family: monospace;
        }

        /* Double tap animation */
        .tap-ripple {
            position: absolute;
            width: 60px; height: 60px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            transform: scale(0);
            animation: ripple 0.5s ease-out;
            pointer-events: none;
            z-index: 15;
        }
        @keyframes ripple {
            to { transform: scale(3); opacity: 0; }
        }

        /* PiP indicator */
        .pip-active-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            background: var(--primary);
            color: #fff;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 30;
        }
        .pip-active-badge.show { opacity: 1; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        /* Mobile tweaks */
        @media (max-width: 640px) {
            .top-bar { padding: 10px 14px; }
            .top-bar .logo { font-size: 17px; }
            .controls-row { padding: 4px 8px 8px; gap: 0; }
            .ctrl-btn { width: 36px; height: 36px; font-size: 15px; }
            .time-display { font-size: 11px; padding: 0 4px; }
            .volume-group:hover .volume-slider-wrap { width: 60px; }
            .volume-slider { width: 52px; }
            .bottom-info { padding: 12px 14px; }
            .info-chip { font-size: 11px; padding: 5px 10px; }
            .play-big-btn { width: 60px; height: 60px; }
            .play-big-btn i { font-size: 22px; }
            .osd-bar { padding: 8px 16px; }
            .osd-bar .osd-track { width: 100px; }
        }

        @media (max-width: 380px) {
            .ctrl-btn { width: 32px; height: 32px; font-size: 14px; }
            .time-display { font-size: 10px; }
        }

        /* Landscape fullscreen tweaks */
        @media (orientation: landscape) and (max-height: 500px) {
            .video-wrapper { height: 100vh; }
        }
    </style>
</head>
<body>
