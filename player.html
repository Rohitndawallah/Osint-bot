<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">PW Lecture - DevCoderZ</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <style>
        body, html { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
        #container { width:100%; height:100%; display:flex; justify-content:center; align-items:center; }
        video { width:100%; height:100%; object-fit:contain; }
    </style>
</head>
<body>

<div id="container">
    <video id="video" crossorigin="anonymous" playsinline></video>
</div>

<script>
    (async () => {
        const params = new URLSearchParams(window.location.search);
        const videoId = params.get('video_id') || params.get('videoId') || '';
        const batchId = params.get('batch_id') || params.get('batchId') || '';
        const title = params.get('title') || params.get('chapterName') || 'PW Lecture';
        
        document.getElementById('pageTitle').textContent = decodeURIComponent(title);

        const video = document.getElementById('video');
        shaka.polyfill.installAll();
        const shakaPlayer = new shaka.Player(video);

        try {
            const apiUrl = `https://DevCoderZ-player.vercel.app/api/player.js?batchId=${batchId}&lectureId=${videoId}`;
            const response = await fetch(apiUrl);
            const streamData = await response.json();
            const source = streamData.url || streamData.stream_url;

            if (!source) throw new Error("Stream not found");

            shakaPlayer.getNetworkingEngine().registerRequestFilter((type, request) => {
                const url = new URL(request.uris[0]);
                request.uris[0] = url.toString();
            });

            await shakaPlayer.load(source);
            new Plyr(video, { autoplay: true });
        } catch (err) {
            console.error(err);
            alert("Error loading video");
        }
    })();
</script>

</body>
</html>
