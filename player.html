<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Player</title>
    <style>
        body, html { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
        iframe { width:100%; height:100%; border:none; }
    </style>
</head>
<body>
    <div id="player-container"></div>

<script>
    (async () => {
        const params = new URLSearchParams(window.location.search);
        const lId = params.get('lectureId') || params.get('id');
        const bId = params.get('batchId') || params.get('batch_id');

        try {
            const res = await fetch(`https://DevCoderZ-player.vercel.app/api/player.js?batchId=${bId}&lectureId=${lId}`);
            const data = await res.json();

            const match = data.url.match(/([a-f0-9-]{36})/);
            const id = match ? match[0] : null;
            const hlsUrl = `https://stream.pimaxer.in/${id}/master.m3u8`;

            const iframe = document.createElement('iframe');
            iframe.src = `https://devcoderz-player.vercel.app/?Url=${encodeURIComponent(hlsUrl)}`;
            iframe.allow = "autoplay; fullscreen; picture-in-picture";
            iframe.allowFullscreen = true;
            
            document.getElementById('player-container').appendChild(iframe);
        } catch (e) {
            console.error("Iframe Error:", e);
        }
    })();
</script>
</body>
</html>
