<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
</head>
<body>
<script>
    (async () => {
        const params = new URLSearchParams(window.location.search);
        const lId = params.get('lectureId') || params.get('id');
        const bId = params.get('batchId') || params.get('batch_id');

        try {
            const res = await fetch(`https://DevCoderZ-player.vercel.app/api/player.js?batchId=${bId}&lectureId=${lId}`);
            const data = await res.json();

            const match = data.url.match(/([a-f0-9-]{36})/);
            const id = match ? match[0] : null;
            const hlsUrl = `https://stream.pimaxer.in/${id}/hls/720/main.m3u8`;

            window.location.href = `https://devcoderz-player.vercel.app/?url=${encodeURIComponent(hlsUrl)}`;
        } catch (e) {
            console.error("Redirect Error:", e);
        }
    })();
</script>
</body>
</html>
