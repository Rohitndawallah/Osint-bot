<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Player</title>
    <style>
        body, html { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
        #player-container { width:100%; height:95%; }
        iframe { width:100%; height:100%; border:none; }
        #footer { color: #fff; font-family: sans-serif; text-align: center; height: 5%; font-size: 12px; padding-top: 5px; }
    </style>
</head>
<body>
    <div id="player-container"></div>
    <div id="footer">Powered by The DevCoderZ</div>

<script>
    (async () => {
        const params = new URLSearchParams(window.location.search);
        const lId = params.get('lectureId') || params.get('id');
        const bId = params.get('batchId') || params.get('batch_id');

        try {
            const res = await fetch(`https://ayush-mirror.vercel.app/api/get-video-url?batchId=${bId}&childId=${lId}`);
            const result = await res.json();
            
            const fullUrl = result.data.url; 
            const match = fullUrl.match(/mediacdn\.pw\.live\/([a-f0-9-]{36})/);
            const id = match ? match[1] : null;

            if (!id) throw new Error("ID extraction failed");

            const hlsUrl = `https://devcoderz-player.vercel.app/rs45.html?Url=https://stream.pimaxer.in/${id}/master.m3u8`;

            const iframe = document.createElement('iframe');
            iframe.src = hlsUrl;
            iframe.allow = "autoplay; fullscreen; picture-in-picture";
            iframe.allowFullscreen = true;
            
            document.getElementById('player-container').appendChild(iframe);
        } catch (e) {
            console.error("Iframe Error:", e);
            document.getElementById('player-container').innerHTML = `<p style="color:red; text-align:center;">Error loading video: ${e.message}</p>`;
        }
    })();
</script>
</body>
</html>
