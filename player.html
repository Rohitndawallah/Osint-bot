<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PW Player</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <style>
        body, html { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
        #container { width:100%; height:100%; display:flex; justify-content:center; align-items:center; }
        video { width:100%; height:100%; }
    </style>
</head>
<body>

<div id="container">
    <video id="video" crossorigin="anonymous" playsinline></video>
</div>

<script>
    (async () => {
        const params = new URLSearchParams(window.location.search);
        const videoId = params.get('videoId') || params.get('lectureId') || params.get('lecture_id') || params.get('id');
        const batchId = params.get('batchId') || params.get('batch_id');

        if (!videoId || !batchId) {
            console.error("Batch ID ya Lecture ID missing hai");
            return;
        }

        const video = document.getElementById('video');
        const shakaPlayer = new shaka.Player(video);

        try {
            const response = await fetch(`https://pw.modgalaxy.in/video-api?batchId=\( {encodeURIComponent(batchId)}&lectureId= \){encodeURIComponent(lecture Id)}`);
            const data = await response.json();

            if (!data.success || !data.url) {
                throw new Error("Invalid API response");
            }

            if (data.drmKeys?.clearKeys) {
                shakaPlayer.configure({
                    drm: {
                        clearKeys: data.drmKeys.clearKeys
                    }
                });
            }

            shakaPlayer.configure({
                streaming: {
                    bufferBehind: 30,
                    bufferingGoal: 60
                }
            });

            await shakaPlayer.load(data.url);

            new Plyr(video, {
                autoplay: true,
                controls: true,
                settings: ['quality', 'speed']
            });

        } catch (err) {
            console.error("Player Error:", err.message);
        }

        shakaPlayer.addEventListener('error', (event) => {
            console.error('Shaka Error:', event.detail);
        });
    })();
</script>

</body>
</html>
