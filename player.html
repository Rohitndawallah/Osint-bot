<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DevCoderz Ultra Performance Player</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none}
.player{position:fixed;inset:0;background:#000;pointer-events:auto}
video{width:100%;height:100%;object-fit:contain}
.top-brand{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:40;text-align:center;pointer-events:none}
.jsr{color:#ff9800;font-weight:700;font-size:14px}
.dev{margin-top:4px;font-size:12px;font-weight:600;color:#00e5ff;text-shadow:0 0 6px #00e5ff}
.center-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;cursor:pointer}
.center-play.hide{display:none}
.center-play span{width:90px;height:90px;background:rgba(255,255,255,.25);backdrop-filter:blur(5px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff}
.controls{position:absolute;bottom:0;width:100%;padding:10px;background:linear-gradient(transparent,rgba(0,0,0,.9));transition:.2s;z-index:35}
.controls.hide{opacity:0;pointer-events:none}
.progress{height:7px;background:#555;border-radius:10px;position:relative;margin-bottom:10px;cursor:pointer}
.progress-fill{height:100%;width:0;background:#2196f3;border-radius:10px}
.thumb{position:absolute;top:-6px;width:18px;height:18px;background:#fff;border-radius:50%;transform:translateX(-50%);left:0}
.time{color:#fff;font-size:11px;margin-bottom:6px}
.row{display:flex;align-items:center;gap:10px;color:#fff}
.btn{width:40px;height:40px;border:1px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
#play.pause::before{content:"❚❚"}
#play::before{content:"▶"}
.settings{position:absolute;bottom:70px;right:10px;background:#111;border-radius:12px;padding:12px;width:140px;display:none;z-index:50}
.settings label{color:#aaa;font-size:10px;display:block;margin-bottom:4px}
.settings select{width:100%;background:#000;color:#fff;border:1px solid #555;border-radius:4px;height:24px;margin-bottom:8px}
.overlay{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:100}
.box{width:300px;padding:20px;border-radius:20px;text-align:center;background:#111;color:#fff}
.join{display:block;margin-top:15px;padding:12px;background:#2196f3;border-radius:20px;color:#fff;text-decoration:none}
</style>
</head>
<body>
<div class="overlay" id="tgPopup"><div class="box"><h3>Ready to watch?</h3><div class="join" id="continueBtn">Continue</div></div></div>
<div class="player" id="player">
 <video id="video" playsinline></video>
 <div class="top-brand"><div class="jsr">🚩 Jai Shree Ram 🚩</div><div class="dev">Ultra Smooth Player</div></div>
 <div class="center-play" id="centerPlay"><span>▶</span></div>
 <div class="controls hide" id="controls">
  <div class="progress" id="progress"><div class="progress-fill" id="bar"></div><div class="thumb" id="thumb"></div></div>
  <div class="time" id="time">00:00 / 00:00</div>
  <div class="row">
   <div class="btn" id="back">⟲</div><div class="btn" id="play"></div><div class="btn" id="fwd">⟳</div>
   <div class="btn" id="settingsBtn">⚙️</div><div class="btn" id="fs">⛶</div>
  </div>
 </div>
 <div class="settings" id="settings">
  <label>Speed</label>
  <select id="speed">
   <option value="1">1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option>
   <option value="1.75">1.75x</option><option value="2">2x</option><option value="2.25">2.25x</option>
   <option value="2.5">2.5x</option><option value="2.75">2.75x</option><option value="3">3x</option>
  </select>
  <label>Quality</label><select id="quality"><option value="-1">Auto</option></select>
 </div>
</div>
<script>
let video=document.getElementById("video"),player,shakaPlayer;
async function init(){
 const params=new URLSearchParams(location.search);
 const res=await fetch(`https://api.pimaxer.in/v1/videos/video-url-details?parentId=${params.get('batchId')}&childId=${params.get('lectureId')}`);
 const data=(await res.json()).data;
 shakaPlayer=new shaka.Player(video);
 const [kid,key]=data.drmDetails.data.split(':');
 shakaPlayer.configure({drm:{clearKeys:{[kid.replace(/-/g,'')]:key}}, abr:{enabled:true}});
 await shakaPlayer.load(data.url);
 setupQuality();
}
function setupQuality(){
 let tracks=shakaPlayer.getVariantTracks();
 tracks.filter(t=>t.height).forEach(t=>{
  let opt=document.createElement("option");
  opt.value=t.id;opt.text=t.height+"p";document.getElementById("quality").appendChild(opt);
 });
}
document.getElementById("continueBtn").onclick=e=>{document.getElementById("tgPopup").style.display="none";init();};
video.ontimeupdate=()=>{
 let p=(video.currentTime/video.duration)*100;
 document.getElementById("bar").style.width=p+"%";
 document.getElementById("thumb").style.left=p+"%";
 document.getElementById("time").textContent=fmt(video.currentTime)+" / "+fmt(video.duration);
};
function fmt(t){let m=Math.floor(t/60),s=Math.floor(t%60);return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
document.getElementById("progress").onpointerdown=e=>{
 let rect=e.target.getBoundingClientRect();
 let pos=(e.clientX-rect.left)/rect.width;
 video.currentTime=pos*video.duration;
};
document.getElementById("play").onclick=()=>video.paused?video.play():video.pause();
document.getElementById("back").onclick=()=>video.currentTime-=10;
document.getElementById("fwd").onclick=()=>video.currentTime+=10;
document.getElementById("settingsBtn").onclick=()=>document.getElementById("settings").style.display=document.getElementById("settings").style.display==="block"?"none":"block";
document.getElementById("speed").onchange=e=>video.playbackRate=e.target.value;
document.getElementById("quality").onchange=e=>shakaPlayer.selectVariantTrack(shakaPlayer.getVariantTracks().find(t=>t.id==e.target.value),true);
document.getElementById("fs").onclick=()=>!document.fullscreenElement?document.getElementById("player").requestFullscreen():document.exitFullscreen();
document.getElementById("player").onclick=e=>{if(e.target===video||e.target.id==='player')document.getElementById("controls").classList.toggle("hide");};
</script>
</body>
</html>
