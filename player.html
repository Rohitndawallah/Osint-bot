<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PW Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { height:100%; overflow:hidden; background:#000; }
        video { width:100%; height:100%; background:#000; }
    </style>
</head>
<body>
    <video id="vid" playsinline controls autoplay></video>

<script>
    (async () => {
        const params = new URLSearchParams(window.location.search);
        const lectureId = params.get('lectureId') || params.get('lecture_id') || params.get('id');
        const batchId = params.get('batchId') || params.get('batch_id');

        if (!lectureId || !batchId) {
            console.error("Lecture ID or Batch ID missing");
            return;
        }

        const vid = document.getElementById('vid');

        try {
            const res = await fetch(`https://pw.modgalaxy.in/video-api?batchId=\( {encodeURIComponent(batchId)}&lectureId= \){encodeURIComponent(lectureId)}`);
            const data = await res.json();

            if (!data.success || !data.url) {
                throw new Error("No video URL");
            }

            // Black screen fix (HEVC disable)
            if (window.MediaSource) {
                const orig = window.MediaSource.isTypeSupported;
                window.MediaSource.isTypeSupported = function(t) {
                    if (t && (t.includes('hev1') || t.includes('hvc1'))) return false;
                    return orig.call(this, t);
                };
            }

            if (data.type === 'dash') {
                shaka.polyfill.installAll();
                const player = new shaka.Player(vid);
                
                if (data.drmKeys && data.drmKeys.clearKeys) {
                    player.configure({ drm: { clearKeys: data.drmKeys.clearKeys } });
                }

                await player.load(data.url);
            } else {
                if (Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(data.url);
                    hls.attachMedia(vid);
                } else {
                    vid.src = data.url;
                }
            }

            vid.play().catch(e => console.log("Autoplay blocked", e));

        } catch (e) {
            console.error("Player Error:", e.message);
        }
    })();
</script>
</body>
</html>
