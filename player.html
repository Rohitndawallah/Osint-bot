<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DevCoderz Ultra Smooth</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none}
.player{position:fixed;inset:0;background:#000;pointer-events:auto}
video{width:100%;height:100%;object-fit:contain}
#status{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#00e5ff;font-size:14px;z-index:1000;pointer-events:none}
.controls{position:absolute;bottom:0;width:100%;padding:15px;background:linear-gradient(transparent,rgba(0,0,0,.9));transition:opacity .2s;z-index:35}
.controls.hide{opacity:0;pointer-events:none}
.progress{height:20px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.progress-bg{height:4px;width:100%;background:#555;border-radius:2px;position:relative}
.progress-fill{height:100%;width:0;background:#2196f3;border-radius:2px}
.thumb{position:absolute;width:14px;height:14px;background:#fff;border-radius:50%;left:0;margin-left:-7px;pointer-events:none;box-shadow:0 0 10px #fff}
.row{display:flex;align-items:center;justify-content:space-between;color:#fff;margin-top:10px}
.btn{padding:10px;cursor:pointer}
.settings{position:absolute;bottom:70px;right:10px;background:#111;border-radius:12px;padding:12px;width:140px;display:none;z-index:50}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:1000}
.box{width:300px;padding:20px;border-radius:20px;text-align:center;background:#1e3c72;color:#fff}
.tg-btn{display:block;margin-top:15px;padding:12px;border-radius:20px;background:#fff;color:#1e3c72;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<div id="status">Ready</div>
<div class="overlay" id="tgPopup">
 <div class="box">
  <h2>Join Telegram</h2>
  <a class="tg-btn" href="https://t.me/+JXdxtVzQf-NhM2Jl" target="_blank">Join</a>
  <div class="tg-btn" id="continueBtn" style="cursor:pointer">Continue</div>
 </div>
</div>
<div class="player" id="player">
 <video id="video" playsinline></video>
 <div class="controls hide" id="controls">
  <div class="progress" id="progress"><div class="progress-bg"><div class="progress-fill" id="bar"></div><div class="thumb" id="thumb"></div></div></div>
  <div class="row">
   <div id="back">⟲10</div><div id="play">▶</div><div id="fwd">10⟳</div>
   <div id="settingsBtn">⚙️</div><div id="fs">⛶</div>
  </div>
 </div>
 <div class="settings" id="settings">
  <label>Speed</label><select id="speed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="1.5">1.5x</option><option value="2">2x</option><option value="3">3x</option><option value="4">4x</option></select>
 </div>
</div>
<script>
let video=document.getElementById("video"),playerDiv=document.getElementById("player"),bar=document.getElementById("bar"),thumb=document.getElementById("thumb"),isDragging=false;
async function init(){
 document.getElementById("status").textContent="Loading...";
 const p=new URLSearchParams(location.search);
 const res=await fetch(`https://devcoderz-api.vercel.app/api/video-url?batch_id=${p.get('batch_id')}&subject_id=${p.get('subject_id')}&video_id=${p.get('video_id')}&video_type=${p.get('video_type')}&title=${encodeURIComponent(p.get('title'))}`);
 const d=await res.json();
 shakaPlayer=new shaka.Player(video);
 if(d.clearKeys){const k=Object.entries(d.clearKeys)[0];shakaPlayer.configure({drm:{clearKeys:{[k[0].replace(/-/g,'')]:k[1]}}});}
 await shakaPlayer.load(d.manifestUrl);
 document.getElementById("status").style.display="none";
}
document.getElementById("continueBtn").onclick=()=>{document.getElementById("tgPopup").style.display="none";init();};
video.ontimeupdate=()=>{if(!isDragging){let p=(video.currentTime/video.duration)*100;bar.style.width=p+"%";thumb.style.left=p+"%";}};
const seek=(e)=>{
 let rect=document.getElementById("progress").getBoundingClientRect();
 let pos=Math.max(0,Math.min(1,((e.clientX||(e.touches?e.touches[0].clientX:0))-rect.left)/rect.width));
 requestAnimationFrame(()=>{bar.style.width=pos*100+"%";thumb.style.left=pos*100+"%";});
 video.currentTime=pos*video.duration;
};
document.getElementById("progress").addEventListener("pointerdown",e=>{isDragging=true;seek(e);});
window.addEventListener("pointermove",e=>{if(isDragging)seek(e);});
window.addEventListener("pointerup",()=>{isDragging=false;});
document.getElementById("play").onclick=()=>video.paused?video.play():video.pause();
document.getElementById("back").onclick=()=>video.currentTime-=10;
document.getElementById("fwd").onclick=()=>video.currentTime+=10;
document.getElementById("settingsBtn").onclick=e=>{e.stopPropagation();let s=document.getElementById("settings");s.style.display=s.style.display==="block"?"none":"block";};
document.getElementById("speed").onchange=e=>{video.playbackRate=e.target.value;};
document.getElementById("fs").onclick=()=>!document.fullscreenElement?playerDiv.requestFullscreen():document.exitFullscreen();
playerDiv.onclick=e=>{if(e.target==video||e.target.id=="player"){document.getElementById("controls").classList.toggle("hide");}};
video.onplay=()=>document.getElementById("play").textContent="❚❚";
video.onpause=()=>document.getElementById("play").textContent="▶";
</script>
</body>
</html>
