<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Powered by The DevCoderZ</title>
    <style>
        body, html { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
        #player-container { width:100%; height:94%; }
        iframe { width:100%; height:100%; border:none; }
        #footer { color: #fff; font-family: sans-serif; text-align: center; height: 6%; font-size: 14px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="player-container"></div>
    <div id="footer">Powered by The DevCoderZ</div>

<script>
    (async () => {
        const params = new URLSearchParams(window.location.search);
        const lId = params.get('lectureId') || params.get('id');
        const bId = params.get('batchId') || params.get('batch_id');

        try {
            // Yahan apni API ka link daalein
            const res = await fetch(`https://devcoderz-player.vercel.app/api.js?batchId=${bId}&lectureId=${lId}`);
            const result = await res.json();
            
            const fullUrl = result.data.url; 
            const match = fullUrl.match(/mediacdn\.pw\.live\/([a-f0-9-]{36})/);
            const id = match ? match[1] : null;

            if (!id) throw new Error("ID not found");

            const hlsUrl = `https://devcoderz-player.vercel.app/rs45.html?Url=https://stream.pimaxer.in/${id}/master.m3u8`;

            const iframe = document.createElement('iframe');
            iframe.src = hlsUrl;
            iframe.allow = "autoplay; fullscreen; picture-in-picture";
            iframe.allowFullscreen = true;
            document.getElementById('player-container').appendChild(iframe);
        } catch (e) {
            document.getElementById('player-container').innerHTML = `<div style="color:white; text-align:center; padding-top:20%;">Error: ${e.message}</div>`;
        }
    })();
</script>
</body>
</html>
