<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>PW Player</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.min.js"></script>
    <style>
        body, html { margin:0; padding:0; width:100%; height:100%; background:#000; }
        #container { width:100%; height:100%; }
        video { width:100%; height:100%; }
    </style>
</head>
<body>
<div id="container"><video id="vid" crossorigin="anonymous" playsinline controls></video></div>
<script>
    (async () => {
        const params = new URLSearchParams(window.location.search);
        const lId = params.get('lectureId') || params.get('id');
        const bId = params.get('batchId') || params.get('batch_id');
        const vid = document.getElementById('vid');

        if (!lId || !bId) return;

        try {
            const res = await fetch(`https://DevCoderZ-player.vercel.app/api/player.js?batchId=${bId}&lectureId=${lId}`);
            const data = await res.json();

            shaka.polyfill.installAll();
            const player = new shaka.Player(vid);
            
            // DRM Config Fix
            if (data.drmKeys && data.drmKeys.clearKeys) {
                const keys = {};
                for (let kid in data.drmKeys.clearKeys) {
                    // Shaka ko KID aur Key dono hex string mein chahiye
                    keys[kid.replace(/-/g, "")] = data.drmKeys.clearKeys[kid];
                }
                player.configure({
                    drm: {
                        clearKeys: keys
                    }
                });
            }

            await player.load(data.url);
            new Plyr(vid, { autoplay: true });
        } catch (e) {
            console.error("Player Error:", e);
        }
    })();
</script>
</body>
</html>
