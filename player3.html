<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevCoderz Player</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        body, html { margin: 0; padding: 0; background: #000; width: 100%; height: 100%; overflow: hidden; }
        video { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <video id="video" playsinline></video>
    <script>
        const v = document.getElementById('video');
        const p = new URLSearchParams(window.location.search);

        async function init() {
            // 1. URL parameters ko API format mein convert karo
            const apiUrl = `https://devcoderz-api.vercel.app/api/video-url?batch_id=${p.get('batch_id')}&subject_id=${p.get('subject_id')}&video_id=${p.get('video_id')}&video_type=${p.get('video_type')}&title=${encodeURIComponent(p.get('title'))}`;

            // 2. API fetch karo
            const res = await fetch(apiUrl);
            const data = await res.json();

            // 3. Shaka Player setup
            const shakaPlayer = new shaka.Player(v);

            // 4. DRM ClearKeys handle karo
            if(data.clearKeys) {
                const kid = Object.keys(data.clearKeys)[0].replace(/-/g, '');
                const key = data.clearKeys[Object.keys(data.clearKeys)[0]];
                shakaPlayer.configure({drm:{clearKeys:{[kid]: key}}});
            }

            // 5. Video load karo
            await shakaPlayer.load(data.manifestUrl);
        }

        init();
    </script>
</body>
</html>
