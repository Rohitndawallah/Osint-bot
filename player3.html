<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.0/shaka-player.compiled.js"></script>
</head>
<body>
    <video id="video" width="640" controls autoplay></video>

    <script>
        const video = document.getElementById('video');
        const player = new shaka.Player(video);

        async function initPlayer() {
            const urlParams = new URLSearchParams(window.location.search);
            const apiUrl = 'https://devcoderz-api.vercel.app/api/video?' + urlParams.toString();

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (!data.success || !data.manifestUrl || !data.clearKeys) {
                    console.error("API Error: Invalid response structure", data);
                    return;
                }

                console.log("Manifest URL received:", data.manifestUrl);
                console.log("ClearKeys received:", data.clearKeys);

                player.configure({
                    drm: {
                        clearKeys: data.clearKeys
                    }
                });

                await player.load(data.manifestUrl);
                console.log("Video playback started successfully.");
            } catch (error) {
                console.error("Error loading video:", error);
            }
        }

        player.addEventListener('error', (event) => {
            console.error("Shaka Player Error Code:", event.detail.code, "Object:", event.detail);
        });

        initPlayer();
    </script>
</body>
</html>
