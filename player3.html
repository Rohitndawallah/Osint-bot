<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.0/shaka-player.compiled.js"></script>
</head>
<body>
    <video id="video" width="640" controls autoplay></video>

    <script>
        const video = document.getElementById('video');
        const videoPlayer = new shaka.Player(video);

        videoPlayer.addEventListener('error', (event) => {
            console.error("Player Error:", event.detail);
        });

        async function initPlayer() {
            const urlParams = new URLSearchParams(window.location.search);
            const apiUrl = 'https://devcoderz-api.vercel.app/api/video?' + urlParams.toString();

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (!data.manifestUrl) {
                    console.error("Failed to retrieve manifest URL");
                    return;
                }
                console.log("URL found:", data.manifestUrl);

                if (!data.clearKeys) {
                    console.error("Failed to retrieve clear keys");
                    return;
                }
                console.log("Keys found:", data.clearKeys);

                videoPlayer.configure({
                    drm: {
                        clearKeys: data.clearKeys
                    }
                });

                await videoPlayer.load(data.manifestUrl);
                console.log("Video loaded successfully");
            } catch (e) {
                console.error("Critical error:", e);
            }
        }

        initPlayer();
    </script>
</body>
</html>
